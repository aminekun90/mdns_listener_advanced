name: Shai-Hulud scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable Corepack (required for Yarn 4)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "yarn"

      # Lifecycle scripts disabled: the payload runs from a postinstall hook.
      - name: Install dependencies without running scripts
        env:
          YARN_ENABLE_SCRIPTS: "false"
        run: yarn install --immutable

      - name: Scan for Shai-Hulud IOCs
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/shai-hulud-scan.sh
